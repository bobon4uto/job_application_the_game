    <body>
        <canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas>
        <p id="output" />
        <script>
            var Module = {
                onRuntimeInitialized: function() {
                  // Now Module is ready for cwrap/_exports
                  startMicMeter();
                },
                print: (function() {
                    var element = document.getElementById('output');
                    if (element) element.value = ''; // clear browser cache
                    return function(text) {
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                        console.log(text);
                        if (element) {
                          element.value += text + "\n";
                          element.scrollTop = element.scrollHeight; // focus on bottom
                        }
                    };
                })(),
                canvas: (function() {
                    var canvas = document.getElementById('canvas');
                    return canvas;
                })()
            };

            function rmsFromTimeDomain(arr) {
              let sumSq = 0;
              for (let i = 0; i < arr.length; i++) sumSq += arr[i] * arr[i];
              return Math.sqrt(sumSq / arr.length);
            }
            
            async function startMicMeter() {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              const audioCtx = new AudioContext();
            
              const analyser = audioCtx.createAnalyser();
              analyser.fftSize = 2048;
              analyser.smoothingTimeConstant = 0.8;
            
              const source = audioCtx.createMediaStreamSource(stream);
              source.connect(analyser);
            
              const buf = new Float32Array(analyser.fftSize);
            
              // Hook up to C exported function
              // Option A: cwrap (convenient + typed)
              const onLoudness = Module.cwrap('on_loudness', null, ['number']);
            
              function tick() {
                analyser.getFloatTimeDomainData(buf);
                const rms = rmsFromTimeDomain(buf);       // ~0..1 depending on mic gain
                const loudness01 = Math.max(0, Math.min(1, rms));
            
                onLoudness(loudness01);
            
                requestAnimationFrame(tick);
              }
            
              tick();
            }


        </script>
